name: Update Border Queue Data

on:
  schedule:
    - cron: '0 * * * *' # Запускать каждый час в 00 минут
  workflow_dispatch: # Позволяет запускать скрипт вручную кнопкой

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешение на перезапись файла gpk_real_archive.json

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run updater script
      run: python gpk_updater.py

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add gpk_real_archive.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Автообновление данных очереди"
        git push
