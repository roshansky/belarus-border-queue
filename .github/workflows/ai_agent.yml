name: Weekly AI Border Report

on:
  schedule:
    # Запуск каждое воскресенье в 18:00 по UTC (отличный момент для планирования недели)[cite: 2]
    - cron: '0 18 * * 0' #[cite: 2]
  workflow_dispatch: # Кнопка ручного запуска для тестирования прямо сейчас[cite: 2]

jobs:
  generate_report:
    runs-on: ubuntu-latest #[cite: 2]
    permissions:
      contents: write # Разрешение на запись файла обратно в репозиторий[cite: 2]

    steps:
      - name: Checkout repository #[cite: 2]
        uses: actions/checkout@v4 #[cite: 2]

      - name: Set up Python #[cite: 2]
        uses: actions/setup-python@v5 #[cite: 2]
        with:
          python-version: '3.12' #[cite: 2]

      - name: Install dependencies #[cite: 2]
        run: |
          python -m pip install --upgrade pip
          # Устанавливаем библиотеки из файла requirements.txt
          pip install -r requirements.txt

      - name: Update border history
        # Сначала запускаем ваш скрипт обновления истории, чтобы создать history.json
        run: python gpk_updater.py

      - name: Run AI Agent #[cite: 2]
        env:
          # Передаем секретный ключ из настроек GitHub в скрипт[cite: 2]
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} #[cite: 2]
        run: python agent_updater.py #[cite: 2]

      - name: Commit and push report #[cite: 2]
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action AI"
          # Добавляем оба файла, если gpk_history.py тоже обновляет данные в репозитории
          git add history.json weekly_report.json
          # Сохраняем результат, если есть изменения[cite: 2]
          git commit -m "🤖 Обновлена история и добавлен отчет ИИ-агента" || echo "Нет изменений для коммита"
          git push
