name: Weekly AI Border Report

on:
  schedule:
    # Запуск каждое воскресенье в 18:00 по UTC (отличный момент для планирования недели)
    - cron: '0 18 * * 0'
  workflow_dispatch: # Кнопка ручного запуска для тестирования прямо сейчас

jobs:
  generate_report:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешение на запись файла обратно в репозиторий

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Устанавливаем библиотеки из файла requirements.txt
          pip install -r requirements.txt

      - name: Run AI Agent
        env:
          # Передаем секретный ключ из настроек GitHub в скрипт
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent_report.py

      - name: Commit and push report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action AI"
          git add weekly_report.json
          # Сохраняем результат, если есть изменения
          git commit -m "🤖 Добавлен еженедельный отчет ИИ-агента" || echo "Нет изменений для коммита"
          git push
